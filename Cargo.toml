[workspace]
members = ["crates/letras-core", "src-tauri"]
resolver = "3"

[workspace.dependencies]
letras-core = { path = "crates/letras-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
